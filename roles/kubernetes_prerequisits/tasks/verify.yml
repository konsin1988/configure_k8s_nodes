---
- name: Get kubelet version
  ansible.builtin.command:
    cmd: kubelet --version
  register: kubelet_version_output
  changed_when: false

- name: Get kubeadm version
  ansible.builtin.command:
    cmd: kubeadm version -o short
  register: kubeadm_version_output
  changed_when: false

- name: Get kubectl version
  ansible.builtin.command:
    cmd: kubectl version --client
  register: kubectl_version_output
  changed_when: false 

- name: Verify Kubernetes component versions
  ansible.builtin.assert:
    that:
      - kubelet_version_output.stdout is search(version_pattern)
      - kubeadm_version_output.stdout is search(version_pattern)
      - kubectl_version_output.stdout is search(version_pattern)
    fail_msg: >-
      Installed Kubernetes component versions do not match
      the required minor version {{ kubernetes_version }}.
    success_msg: >-
      All Kubernetes components match minor version {{ kubernetes_version }}.
  vars:
    version_pattern: 'v{{ kubernetes_version | regex_escape }}\.'

- name: Display installed k8s versions
  ansible.builtin.debug:
    msg: 
      - "{{ kubelet_version_output.stdout }}"
      - "{{ kubeadm_version_output.stdout }}"
      - "{{ kubectl_version_output.stdout }}"
