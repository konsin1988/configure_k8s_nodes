---
- name: Disable swap immediately
  ansible.builtin.command:
    cmd: swapoff -a
  when: ansible_facts['swaptotal_mb'] | default(0) | int > 0
  changed_when: true

- name: Disable swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#]\S*\s+\S+\s+swap\s+.*)$'
    replace: '# \1'
    backup: true
